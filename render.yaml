# Render Blueprint (render.com/docs/blueprint-spec)
# Deploy with: New -> Blueprint -> point at this repo.
# Retires the "does the host sleep the worker" risk from Chunk 1
# by declaring the worker as its own always-on service from day one
# (Design Document §2.3 / SDP risk table).

services:
  - type: web
    name: healthcare-appt-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-appt-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: healthcare-appt-redis
          property: connectionString

  - type: worker
    name: healthcare-appt-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A worker.celery worker --loglevel=info
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-appt-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: healthcare-appt-redis
          property: connectionString

  # L4 fix: Separate beat service for periodic tasks (sweep every 30s, notify retry every 60s)
  # Design Document §2.3: beat and worker are separate processes so the scheduler
  # never blocks on task execution.
  - type: worker
    name: healthcare-appt-beat
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A worker.celery beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-appt-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: healthcare-appt-redis
          property: connectionString

  - type: redis
    name: healthcare-appt-redis
    ipAllowList: []
    plan: free

databases:
  - name: healthcare-appt-db
    plan: free
